  <body>
    <section class="app">
      <!-- SIDEBAR -->
      <section class="sidebar">
        <div class="sidebar-header">
          <h2>DASHBOARD</h2>
        </div>
        <ul class="sidebar-menu">
          <li><a href="dashboard.html">Dashboard</a></li>

          <li><a href="produk.html" class="active">Produk</a></li>
          <li><a href="riwayat.html">Riwayat</a></li>
          <li><a href="member.html">Member</a></li>
          <li><a href="buat-barcode.html">Buat Barcode</a></li>
        </ul>

        <div class="button-aside">
          <button class="btn-instal" id="installBtn" style="display: none">
            Install Aplikasi
          </button>
          <button class="btn-logout" onclick="logoutKasir()">Logout</button>
        </div>
      </section>
      <!-- Content -->
      <main class="content">
        <h1>Manajemen Produk</h1>

        <div class="card">
          <label for="searchProduk">Cari Produk</label>

          <!-- WRAPPER: input + hasil pencarian -->
          <div class="search-wrapper">
            <input
              type="text"
              id="searchProduk"
              placeholder="nama produk..."
              autocomplete="off"
            />

            <!-- HASIL PENCARIAN -->
            <div id="hasilPencarianProduk"></div>
          </div>

          <label for="filterStok">Filter Stok</label>
          <select id="filterStok" onchange="renderProduk()">
            <option value="all">Semua</option>
            <option value="tersedia">Stok Tersedia</option>
            <option value="habis">Stok Habis</option>
            <option value="menipis">Stok Menipis (≤ 5)</option>
          </select>
        </div>

        <div
          id="reader"
          style="width: 100%; max-width: 400px; margin: auto"
        ></div>
        <button id="kamera" onclick="mulaiScan()">Buka Kamera Scan</button>

        <!-- Form Produk -->
        <div class="card" style="display: flex; flex-direction: column">
          <input type="hidden" id="produkId" />
          <label>Barcode / SKU</label>
          <input
            type="text"
            id="barcodeProduk"
            placeholder="Scan atau ketik barcode..."
            readonly
            style="background: #f0f0f0"
          />
          <label>Nama Produk</label>
          <input type="text" id="namaProduk" placeholder="Tulis Produk" />
          <label>Foto Produk</label>
          <input
            type="file"
            id="fotoProduk"
            accept="image/*"
            onchange="previewImage(event)"
          />
          <img
            id="imgPreview"
            src=""
            style="
              display: none;
              width: 100px;
              height: 100px;
              object-fit: cover;
              margin-top: 10px;
              border-radius: 8px;
            "
          />
          <label>Modal / Unit</label>
          <input type="number" id="modalProduk" />
          <label>Harga Jual / Unit</label>
          <input type="number" id="hargaProduk" />
          <label>Stok Awal</label>
          <input type="number" id="stokProduk" min="0" />
          <button onclick="simpanProduk()">Simpan Produk</button>
        </div>
        <!-- Tabel Produk -->
        <div class="card">
          <h3>Daftar Produk</h3>

          <div class="table-wrapper">
            <!-- ← wrapper baru -->
            <table>
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Barcode</th>
                  <th>Nama</th>
                  <th>Modal</th>
                  <th>Harga</th>
                  <th>Stok</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="produkTable"></tbody>
            </table>
          </div>

          <div
            id="navigasiProduk"
            style="
              display: none;
              justify-content: center;
              align-items: center;
              gap: 15px;
              margin-top: 20px;
              padding: 10px;
            "
          >
            <button
              id="btnPrevProduk"
              onclick="gantiHalamanProduk(-1)"
              style="
                padding: 8px 15px;
                background: #4a5568;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              "
            >
              ⬅ Prev
            </button>

            <span id="infoHalamanProduk" style="font-weight: bold"
              >Halaman 1</span
            >

            <button
              id="btnNextProduk"
              onclick="gantiHalamanProduk(1)"
              style="
                padding: 8px 15px;
                background: #4a5568;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              "
            >
              Next ➡
            </button>
          </div>
        </div>

<div class="card card-export">
  <h3>Cadangan Data Produk</h3>
  
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <!-- Excel Saja -->
    <button onclick="eksporExcelProduk()" style="background: #16a34a; color: white;">💾 Download Excel (Teks)</button>
    <label for="inputImporExcel" style="background: #22c55e; color: white; padding: 10px; border-radius: 5px; cursor: pointer;">📥 Upload Excel (Teks)</label>
    <input type="file" id="inputImporExcel" accept=".xlsx" onchange="imporExcelProduk(event)" style="display: none;" />

    <!-- ZIP + Foto -->
    <button onclick="eksporZipProduk(event)" style="background: #f37d0e; color: white;">📦 Download ZIP (Excel + Foto)</button>
    <label for="inputImporZip" style="background: #f59e0b; color: white; padding: 10px; border-radius: 5px; cursor: pointer;">📥 Upload ZIP + Foto</label>
    <input type="file" id="inputImporZip" accept=".zip" onchange="imporZipProduk(event)" style="display: none;" />
  </div>
</div>



</main>

        navigator.serviceWorker
