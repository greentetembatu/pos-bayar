<!doctype html>
<html lang="id">
  <head>
    <!-- ==============================
       DASAR & PWA
  ============================== -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- ==============================
       PRIVASI: CEGAH GOOGLE MENGINDEKS
       (Sangat penting untuk halaman dashboard)
  ============================== -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard - KasirKu By: Asbin Ecosystem</title>

    <!-- ==============================
       FAVICON & MANIFEST (Path Absolut)
  ============================== -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/android-icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ==============================
       PWA / MOBILE
  ============================== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KasirKu" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ==============================
       PERFORMA — Font Google
  ============================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--<link rel="stylesheet" href="style.css" />-->
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <section class="app">
      <!-- SIDEBAR -->
      <section class="sidebar">
        <div class="sidebar-header">
          <h2>DASHBOARD</h2>
        </div>
        <ul class="sidebar-menu">
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="kasir.html">Kasir</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a href="riwayat.html">Riwayat</a></li>
          <li><a href="member.html">Member</a></li>
          <li><a href="buat-barcode.html">Cetak Barcode</a></li>
        </ul>

        <div class="button-aside">
          <button class="btn-instal" id="installBtn" style="display: none">
            Install Aplikasi
          </button>
          <button class="btn-logout" onclick="logoutKasir()">Logout</button>
        </div>
      </section>

      <main class="content">
        <header class="content-header">
          <h1>Dashboard</h1>
          <h3>Pengaturan Toko</h3>

          <input type="text" id="namaToko" placeholder="Nama Toko" />
          <input type="text" id="alamatToko" placeholder="Teks Baris 1" />
          <input type="text" id="additionalToko" placeholder="Teks Baris 2" />
          <div class="button-simpan-header">
            <button onclick="simpanPengaturanToko()">Simpan</button>
          </div>
        </header>

        <a href="kasir.html" class="btn-primary">➜ Buka Kasir</a>

        <section class="stats">
          <a href="produk.html" style="text-decoration: none; color: inherit">
            <div class="card stat-card">
              <h3>Total Produk</h3>
              <p id="totalProduk">0</p>
            </div>
          </a>
          <a href="riwayat.html" style="text-decoration: none; color: inherit">
            <div class="card stat-card">
              <h3>Total Transaksi</h3>
              <p id="totalTransaksi">0</p>
            </div>
          </a>
          <div class="card stat-card">
            <h3>Omzet</h3>
            <p id="totalOmzet">Rp 0</p>
          </div>
          <div class="card stat-card">
            <h3>Laba</h3>
            <p id="totalLaba">Rp 0</p>
          </div>
        </section>
      </main>
    </section>
    <!-- SCRIPT (TIDAK DIUBAH) -->

    <script src="js/dasboard.js"></script>
    <script src="js/data.js"></script>
    <script src="js/struk.js"></script>
    <script src="js/kasir.js"></script>
    <script src="js/produk.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/riwayat.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("service-worker.js")
          .then(() => console.log("Service Worker registered"))
          .catch((err) => console.error("SW failed:", err));
      }
    </script>
  </body>
</html>
