  <body>
    <section class="app">
      <!-- SIDEBAR -->
      <section class="sidebar">
        <div class="sidebar-header">
          <h2>DASHBOARD</h2>

        <ul class="sidebar-menu">

        </ul>

        <div class="button-aside">
          <button class="btn-instal" id="installBtn" style="display: none">
            Install Aplikasi
          </button>
          <button class="btn-logout" onclick="logoutKasir()">Logout</button>
        </div>
      </section>
      <!-- Content -->
      <main class="content">

        <!-- ===================== -->
<!-- CARD: GENERATOR BARCODE -->
<!-- ===================== -->
<div
  class="card"
  style="
    display: flex;
    flex-direction: column;
    padding: 20px;
    width: 100%;
    gap: 12px;
  "
>
  <h3 style="margin: 0 0 5px; font-size: 15px;">🏷️ Buat Barcode Baru</h3>

  <!-- Pilih format -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <label style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
      <input type="radio" name="formatBarcode" value="EAN13" checked>
      EAN-13 (bisa discan)
    </label>
    <label style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
      <input type="radio" name="formatBarcode" value="CODE128">
      CODE128 (teks/angka)
    </label>
  </div>

  <!-- Tombol Generate -->
  <button
    type="button"
    onclick="buatBarcodeBaru()"
    style="
      background: #2563eb;
      color: white;
      padding: 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    "
  >
    🎲 Buat Barcode Baru
  </button>

  <!-- Area Preview Barcode -->
  <div
    id="previewBarcodeBox"
    style="
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 15px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
    "
  >
    <div style="font-size: 12px; color: #64748b;">Preview Barcode</div>

    <!-- Canvas untuk render barcode -->
    <canvas id="barcodeCanvas" style="max-width: 100%;"></canvas>

    <!-- Teks kode barcode -->
    <div
      id="barcodeTextLabel"
      style="
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
      "
    ></div>

    <!-- Tombol aksi -->
    <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
      <button
        type="button"
        onclick="copyBarcodeKeClipboard()"
        style="background: #16a34a; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;"
      >
        📋 Copy Kode
      </button>

      <button
        type="button"
        onclick="printBarcode()"
        style="background: #f59e0b; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;"
      >
        🖨️ Print
      </button>

      <button
        type="button"
        onclick="downloadBarcodePNG()"
        style="background: #7c3aed; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;"
      >
        💾 Simpan PNG
      </button>
    </div>
  </div>
</div>

      </main>
    </section>
    <script src="js/barcode.js"></script>
    <script src="js/data.js"></script>
    <script src="js/produk.js"></script>

    <script src="js/storage.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("service-worker.js")
          .then(() => console.log("Service Worker registered"))
          .catch((err) => console.error("SW failed:", err));
      }
    </script>
  </body>
